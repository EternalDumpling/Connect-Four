<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Four</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Connect Four</h1>

    <div class="mode-selector">
      <button class="mode-btn active" id="modeHuman" data-mode="human">2 Players</button>
      <button class="mode-btn" id="modeCpu" data-mode="cpu">vs CPU</button>
    </div>

    <div class="difficulty-selector hidden" id="difficultySelector">
      <button class="diff-btn" id="diffEasy" data-diff="easy">Easy</button>
      <button class="diff-btn active" id="diffMedium" data-diff="medium">Medium</button>
      <button class="diff-btn" id="diffHard" data-diff="hard">Hard</button>
    </div>

    <div class="scoreboard">
      <div class="score player1">
        <span class="score-label">Player 1</span>
        <span class="score-value" id="score1">0</span>
      </div>
      <div class="score draws">
        <span class="score-label">Draws</span>
        <span class="score-value" id="scoreDraws">0</span>
      </div>
      <div class="score player2">
        <span class="score-label" id="p2Label">Player 2</span>
        <span class="score-value" id="score2">0</span>
      </div>
    </div>

    <div class="status" id="status">Player 1's turn</div>

    <div class="board-wrapper">
      <div class="column-indicators" id="columnIndicators"></div>
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button id="resetBtn">New Game</button>
      <button id="resetScoresBtn">Reset Scores</button>
    </div>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <div class="modal-message" id="modalMessage"></div>
      <button id="modalBtn">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
